[package]
name = "terminalflow"
version = "2.0.0"
edition = "2021"
authors = ["reyansh14coder-ux"]
description = "🚀 AI-Powered Terminal Dashboard for Developers - The Ultimate Dev Toolkit with 20+ Extreme Features"
license = "MIT"
repository = "https://github.com/reyansh14coder-ux/terminalflow"
homepage = "https://github.com/reyansh14coder-ux/terminalflow"
documentation = "https://github.com/reyansh14coder-ux/terminalflow#readme"
readme = "README.md"
keywords = ["terminal", "dashboard", "ai", "productivity", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.70"

[dependencies]
crossterm = "0.27"
ratatui = "0.26"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.18"
colored = "2.0"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
console = "0.15"
toml = "0.8"
regex = "1.10"
rand = "0.8"
sysinfo = "0.30"
chacha20poly1305 = "0.10.1"
pbkdf2 = "0.12.2"
sha2 = "0.10.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
