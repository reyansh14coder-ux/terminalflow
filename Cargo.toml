[package]
name = "terminalflow"
version = "2.0.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "🚀 AI-Powered Terminal Dashboard for Developers - The productivity tool you'll actually want to use"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/terminalflow"
homepage = "https://terminalflow.dev"
documentation = "https://docs.terminalflow.dev"
readme = "README.md"
keywords = ["terminal", "dashboard", "ai", "productivity", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.70"

[dependencies]
crossterm = "0.27"
ratatui = "0.26"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.18"
colored = "2.0"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
console = "0.15"
keyring = "2.0"
toml = "0.8"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
